<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map source test</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0 auto;padding:16px;color:#111;background:#fff;max-width:1100px}
h1{font-size:20px;margin:0 0 6px}
h2{font-size:16px;margin:0 0 6px}
p.note{font-size:13px;color:#555;margin:6px 0}
form{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input[type=text]{flex:1;min-width:220px;padding:8px;font-size:16px;border:1px solid #bbb;border-radius:6px}
button{padding:8px 14px;font-size:15px;border:1px solid #888;border-radius:6px;background:#fff;cursor:pointer}
button.primary{background:#111;color:#fff;border-color:#111}
button:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.stage{position:relative;width:100%;background:#eee;border:1px solid #ccc;touch-action:none;user-select:none}
.stage canvas{display:block;width:100%;height:auto}
.box{position:absolute;border:2px dashed #e11d48;background:rgba(225,29,72,.12);display:none;pointer-events:none}
.status{font-size:13px;margin:6px 0;min-height:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.out{width:100%;margin-top:10px;border:1px solid #ccc;display:none}
.ok{color:#15803d}.bad{color:#b45309}
</style>
</head>
<body>
<h1>Map source test (free options)</h1>
<p class="note">Type an address. It is sent once to OpenStreetMap's search service to find coordinates. The address is not saved by this page. Draw a box on either picture, then press Crop box.</p>
<form id="f"><input type="text" id="addr" placeholder="123 Main St, Town, ST" autocomplete="off"><button class="primary" type="submit">Find</button></form>
<div class="status" id="gstat"></div>
<div class="grid">
  <div>
    <h2>OpenStreetMap street map</h2>
    <div class="stage" id="osmStage"></div>
    <div class="row" style="margin-top:6px"><button id="osmCrop" disabled>Crop box</button><button id="osmSave" disabled>Save cropped picture</button></div>
    <div class="status" id="osmStat"></div>
    <canvas class="out" id="osmOut"></canvas>
  </div>
  <div>
    <h2>USGS aerial photo (US only)</h2>
    <div class="stage" id="naipStage"></div>
    <div class="row" style="margin-top:6px"><button id="naipCrop" disabled>Crop box</button><button id="naipSave" disabled>Save cropped picture</button></div>
    <div class="status" id="naipStat"></div>
    <canvas class="out" id="naipOut"></canvas>
  </div>
</div>
<script>
const R = 6378137;
const sources = {
  osm:  { stage: document.getElementById('osmStage'),  stat: document.getElementById('osmStat'),  crop: document.getElementById('osmCrop'),  save: document.getElementById('osmSave'),  out: document.getElementById('osmOut'),  sel: null },
  naip: { stage: document.getElementById('naipStage'), stat: document.getElementById('naipStat'), crop: document.getElementById('naipCrop'), save: document.getElementById('naipSave'), out: document.getElementById('naipOut'), sel: null }
};

// load an image; try with CORS first so the canvas can be saved, then without it
function loadImg(url){
  return new Promise(resolve => {
    const attempt = useCors => {
      const im = new Image();
      if(useCors) im.crossOrigin = 'anonymous';
      im.onload = () => resolve({ img: im, cors: useCors });
      im.onerror = () => useCors ? attempt(false) : resolve(null);
      im.src = url;
    };
    attempt(true);
  });
}

function mercator(lat, lon){
  return { x: R * lon * Math.PI / 180, y: R * Math.log(Math.tan(Math.PI/4 + lat * Math.PI / 360)) };
}

async function buildOSM(lat, lon){
  const z = 18, n = Math.pow(2, z);
  const px = (lon + 180) / 360 * n * 256;
  const latR = lat * Math.PI / 180;
  const py = (1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2 * n * 256;
  const tx0 = Math.floor(px / 256) - 1, ty0 = Math.floor(py / 256) - 1;
  const canvas = document.createElement('canvas');
  canvas.width = 768; canvas.height = 768;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ddd'; ctx.fillRect(0, 0, 768, 768);
  const jobs = [];
  for(let i = 0; i < 3; i++) for(let j = 0; j < 3; j++){
    const url = `https://tile.openstreetmap.org/${z}/${tx0 + i}/${ty0 + j}.png`;
    jobs.push(loadImg(url).then(r => { if(r) ctx.drawImage(r.img, i * 256, j * 256, 256, 256); return r; }));
  }
  const results = await Promise.all(jobs);
  if(results.every(r => r === null)) throw new Error('OpenStreetMap tiles did not load');
  ctx.fillStyle = '#e11d48';
  ctx.beginPath(); ctx.arc(px - tx0 * 256, py - ty0 * 256, 5, 0, Math.PI * 2); ctx.fill();
  const corsOk = results.every(r => r === null || r.cors);
  return { canvas, corsOk };
}

async function buildNAIP(lat, lon){
  const c = mercator(lat, lon);
  const half = 150; // about 300 m square around the address
  const bbox = [c.x - half, c.y - half, c.x + half, c.y + half].join(',');
  const url = 'https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer/exportImage'
    + `?bbox=${bbox}&bboxSR=3857&imageSR=3857&size=768,768&format=png&f=image`;
  const r = await loadImg(url);
  if(!r) throw new Error('USGS imagery did not load (service address or coverage may be wrong)');
  const canvas = document.createElement('canvas');
  canvas.width = 768; canvas.height = 768;
  canvas.getContext('2d').drawImage(r.img, 0, 0, 768, 768);
  return { canvas, corsOk: r.cors };
}

// show a built picture in its stage and wire up the box drawing
function showPicture(key, built, note){
  const s = sources[key];
  s.stage.innerHTML = '';
  built.canvas.style.width = '100%';
  s.stage.appendChild(built.canvas);
  const box = document.createElement('div');
  box.className = 'box';
  s.stage.appendChild(box);
  s.sel = { src: built.canvas, box, rect: null, corsOk: built.corsOk };
  s.out.style.display = 'none';
  s.crop.disabled = true; s.save.disabled = true;
  s.stat.className = 'status ' + (built.corsOk ? 'ok' : 'bad');
  s.stat.textContent = note + (built.corsOk ? '' : ' Saving will be blocked for this source.');

  let start = null;
  const frac = e => {
    const r = s.stage.getBoundingClientRect();
    return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) };
  };
  const paint = rect => {
    box.style.display = 'block';
    box.style.left = (rect.x * 100) + '%';
    box.style.top = (rect.y * 100) + '%';
    box.style.width = (rect.w * 100) + '%';
    box.style.height = (rect.h * 100) + '%';
  };
  s.stage.onpointerdown = e => { s.stage.setPointerCapture(e.pointerId); start = frac(e); };
  s.stage.onpointermove = e => {
    if(!start) return;
    const p = frac(e);
    const rect = { x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y) };
    s.sel.rect = rect; paint(rect);
  };
  s.stage.onpointerup = () => {
    start = null;
    const ok = s.sel.rect && s.sel.rect.w > 0.03 && s.sel.rect.h > 0.03;
    if(!ok){ s.sel.rect = null; box.style.display = 'none'; }
    s.crop.disabled = !ok;
  };
}

function cropSelection(key){
  const s = sources[key];
  if(!s.sel || !s.sel.rect) return;
  const src = s.sel.src, r = s.sel.rect;
  const sx = Math.round(r.x * src.width), sy = Math.round(r.y * src.height);
  const sw = Math.round(r.w * src.width), sh = Math.round(r.h * src.height);
  s.out.width = sw; s.out.height = sh;
  s.out.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
  s.out.style.display = 'block';
  s.save.disabled = !s.sel.corsOk;
  s.stat.className = 'status ' + (s.sel.corsOk ? 'ok' : 'bad');
  s.stat.textContent = 'Cropped to ' + sw + ' by ' + sh + ' pixels.' + (s.sel.corsOk ? '' : ' This source does not allow saving the cropped picture.');
}

function saveSelection(key){
  const s = sources[key];
  try {
    const url = s.out.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = key + '-crop.png'; a.click();
    s.stat.className = 'status ok';
    s.stat.textContent = 'Saved as ' + key + '-crop.png';
  } catch(err) {
    s.stat.className = 'status bad';
    s.stat.textContent = 'Saving blocked by the browser for this source.';
  }
}

document.getElementById('osmCrop').onclick = () => cropSelection('osm');
document.getElementById('naipCrop').onclick = () => cropSelection('naip');
document.getElementById('osmSave').onclick = () => saveSelection('osm');
document.getElementById('naipSave').onclick = () => saveSelection('naip');

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = document.getElementById('addr').value.trim();
  const g = document.getElementById('gstat');
  if(!q){ g.className = 'status bad'; g.textContent = 'Type an address first.'; return; }
  g.className = 'status'; g.textContent = 'Finding the address...';
  let lat, lon;
  try {
    const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const data = await res.json();
    if(!data.length) throw new Error('not found');
    lat = parseFloat(data[0].lat); lon = parseFloat(data[0].lon);
    g.className = 'status ok';
    g.textContent = 'Found: ' + data[0].display_name.split(',').slice(0, 3).join(',') + ' (' + lat.toFixed(5) + ', ' + lon.toFixed(5) + ')';
  } catch(err) {
    g.className = 'status bad';
    g.textContent = 'Could not find that address. Try a fuller address with city and state.';
    return;
  }
  for(const key of ['osm', 'naip']) sources[key].stat.textContent = 'Loading...';
  buildOSM(lat, lon).then(b => showPicture('osm', b, 'Street map loaded.'))
    .catch(err => { sources.osm.stat.className = 'status bad'; sources.osm.stat.textContent = err.message; });
  buildNAIP(lat, lon).then(b => showPicture('naip', b, 'Aerial photo loaded.'))
    .catch(err => { sources.naip.stat.className = 'status bad'; sources.naip.stat.textContent = err.message; });
});
</script>
</body>
</html>
